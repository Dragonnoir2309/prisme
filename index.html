<div id="ov"></div>

<div id="mobileControls" aria-hidden="true">
  <div id="joystick"><div id="stick"></div></div>

  <button id="pauseBtn" class="mBtn small">Ⅱ</button>

const cv=document.getElementById('g'),x=cv.getContext('2d'),ov=document.getElementById('ov');

let best=0;try{best=+localStorage.getItem('prisme-best')||0}catch(e){}
const K={};
const touchMode = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
let touchJoyId=null, touchDashId=null;
function setTouchDir(px,py){
  const r=document.getElementById('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=px-cx,dy=py-cy,lim=r.width*.34,m=Math.hypot(dx,dy);
  if(m>lim){dx=dx/m*lim;dy=dy/m*lim}
  const mx=dx/lim,my=dy/lim;
  for(const k of ['z','q','s','d'])K[k]=0;
  if(Math.abs(mx)>.18)K[mx>0?'d':'q']=1;
  if(Math.abs(my)>.18)K[my>0?'s':'z']=1;
  const st=document.getElementById('stick');st.style.transform=`translate(${dx}px,${dy}px)`;
}
function clearTouchDir(){for(const k of ['z','q','s','d'])K[k]=0;document.getElementById('stick').style.transform='translate(0,0)'}
function syncMobileControls(){
  const active=touchMode && (state==='play'||state==='pause');
  document.body.classList.toggle('gameActive',active);
  const mc=document.getElementById('mobileControls');
  if(mc)mc.setAttribute('aria-hidden',active?'false':'true');
}
function setupTouch(){
  if(!touchMode)return;
  document.body.classList.add('touchMode');
  const j=document.getElementById('joystick'),d=document.getElementById('dashBtn'),p=document.getElementById('pauseBtn');
  j.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchJoyId=t.identifier;setTouchDir(t.clientX,t.clientY);e.preventDefault()},{passive:false});
  j.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===touchJoyId)setTouchDir(t.clientX,t.clientY);e.preventDefault()},{passive:false});
  j.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===touchJoyId){touchJoyId=null;clearTouchDir()}e.preventDefault()},{passive:false});
  j.addEventListener('touchcancel',()=>{touchJoyId=null;clearTouchDir()},{passive:false});
  d.addEventListener('touchstart',e=>{K[' ']=1;touchDashId=e.changedTouches[0].identifier;e.preventDefault();d.style.transform='scale(.93)'},{passive:false});
  d.addEventListener('touchend',e=>{K[' ']=0;touchDashId=null;e.preventDefault();d.style.transform='scale(1)'},{passive:false});
  d.addEventListener('touchcancel',()=>{K[' ']=0;touchDashId=null;d.style.transform='scale(1)'},{passive:false});
  p.addEventListener('touchstart',e=>{e.preventDefault();if(state==='play'||state==='pause')pause()},{passive:false});
  document.addEventListener('touchmove',e=>{if(state==='play'||state==='pause')e.preventDefault()},{passive:false});
}

let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;
if(state==='play')update(dt);
